project_name: druglab_run
output_dir: output
protein:
  remove_water: true
  remove_heterogens: true
  add_hydrogens: true
  fix_missing_residues: true
  fix_missing_atoms: true
  ph: 7.4
  chain_id: null
  keep_ligands: []
pocket:
  method: geometric
  selection_mode: best_score
  min_pocket_size: 100.0
  max_pockets: 5
  padding: 5.0
  max_box_dimension: 30.0
  warn_large_boxes: true
  manual_center: null
  manual_size: null
  reference_ligand: null
ligand:
  add_hydrogens: true
  generate_3d: true
  num_conformers: 1
  energy_minimize: true
  ph: 7.4
  max_tautomers: 1
  convert_to_pdbqt: true
druglikeness:
  profile: recommended
  rules:
  - lipinski
  evaluation_mode: majority
  minimum_rule_pass_fraction: 0.7
  max_violations: 1
  brenk_mode: warning
  strict: false
  custom_filters: null
admet:
  profile: balanced
  target_type: auto
  filter_toxic: true
  filter_low_absorption: true
  thresholds: null
  models: null
docking:
  exhaustiveness: 32
  n_poses: 10
  energy_range: 3.0
  seed: 42
  n_cpus: 0
  score_only: false
lead_selection:
  top_n: 5
  scoring_method: weighted_sum
  weights:
    affinity: 0.5
    admet: 0.3
    druglikeness: 0.2
  affinity_cutoff: -6.0
  diversity_filter: true
  similarity_cutoff: 0.7
optimization:
  strategies:
  - bioisostere
  - scaffold_hop
  - r_group
  max_analogues: 100
  similarity_range:
  - 0.4
  - 0.9
  mw_range:
  - 150.0
  - 600.0
  top_n: 10
  custom_fragments: null
report:
  format: html
  include_charts: true
  include_raw_data: true
logging:
  level: INFO
  verbose: false
