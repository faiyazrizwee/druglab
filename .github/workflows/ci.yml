name: DrugLab CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          auto-update-conda: false

      - name: Install dependencies via Conda & Pip
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge \
            rdkit biopython gemmi numpy pandas scipy scikit-learn \
            openbabel openmm pdbfixer vina pytest pytest-cov matplotlib pyyaml
          pip install jinja2 plotly rich tqdm meeko

      - name: Install DrugLab in editable mode
        shell: bash -el {0}
        run: |
          pip install -e . --no-deps

      - name: Verify CLI Entry Points
        shell: bash -el {0}
        run: |
          druglab --help
          druglab run --help
          druglab protein --help
          druglab pocket --help
          druglab ligand --help
          druglab screen --help
          druglab dock --help
          druglab select --help
          druglab optimize --help
          druglab report --help
          druglab fetch --help
          druglab peptide --help
          druglab peptide run --help
          druglab peptide prepare --help
          druglab peptide report --help

      - name: Run Unit Tests with Coverage
        shell: bash -el {0}
        run: |
          pytest tests/ -v -m "not integration" --cov=core --cov=drug_selection --cov=lead_optimization --cov=utils --cov=reports

      - name: Install Peptide Dependencies & Run Integration Smoke Test
        shell: bash -el {0}
        run: |
          pip install -e ".[peptide]"
          pytest tests/test_peptide_integration.py -v

  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: druglab:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
