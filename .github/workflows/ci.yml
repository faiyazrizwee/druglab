name: DrugLab CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          auto-update-conda: false

      - name: Install dependencies via Conda
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge \
            rdkit biopython gemmi numpy pandas scipy scikit-learn \
            openbabel openmm pdbfixer vina pytest pytest-cov
          pip install jinja2 plotly rich tqdm meeko pyyaml

      - name: Install DrugLab in editable mode
        shell: bash -el {0}
        run: |
          pip install -e . --no-deps

      - name: Run Test Suite
        shell: bash -el {0}
        run: |
          pytest tests/ -v --cov=core --cov=drug_selection --cov=lead_optimization --cov=utils --cov=reports
